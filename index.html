<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            position: relative;
        }

        body {
            position: relative;
            background: linear-gradient(135deg, #1a1c20 0%, #2d3436 100%);
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: fixed;
            background: white;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(20px);
                opacity: 0;
            }
        }

        .game-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            z-index: 1;
        }

        /* Game board styling update */
        #game-board {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: repeat(3, 120px);
            gap: 12px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            margin: 0 auto;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .game-container {
                padding: 10px;
            }

            #game-board {
                grid-template-columns: repeat(3, 90px);
                grid-template-rows: repeat(3, 90px);
                gap: 8px;
                padding: 10px;
            }

            .cell {
                width: 90px;
                height: 90px;
                font-size: 40px;
            }
        }

        .cell {
            width: 100px;
            height: 100px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            cursor: pointer;
        }
        .cell:hover {
            background-color: #e0e0e0;
        }
        .cell.x {
            color: #000;
        }
        .cell.o {
            color: #f00;
        }
        #game-info {
            margin-top: 20px;
            text-align: center;
        }
        h2 {
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>

</head>
<body>
    <div class="background">
        <!-- grid div removed -->
    </div>
    
    <div class="game-container">
        <div id="game-board"></div>
        <div id="game-info">
            <h2>Tic Tac Toe</h2>
            <p>Player X's Turn</p>
            <button id="reset-button">Reset Game</button>
        </div>
    </div>

    <script>
        const board = ['', '', '', '', '', '', '', '', ''];
        const gameBoard = document.getElementById('game-board');
        const gameInfo = document.getElementById('game-info');
        const resetButton = document.getElementById('reset-button');
        let currentPlayer = 'X';
        let gameOver = false;
        function createBoard() {
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.index = i;
                cell.addEventListener('click', handleClick);
                gameBoard.appendChild(cell);
            }
        }

        function handleClick(e) {
            if (gameOver) return;
            const cellIndex = parseInt(e.target.dataset.index);
            if (board[cellIndex] !== '') return;

            board[cellIndex] = currentPlayer;
            e.target.textContent = currentPlayer;
            e.target.classList.add(currentPlayer.toLowerCase());

            if (checkWin()) {
                gameOver = true;
                gameInfo.querySelector('p').textContent = `Player ${currentPlayer} Wins!`;
            } else if (checkDraw()) {
                gameOver = true;
                gameInfo.querySelector('p').textContent = 'It is a Draw!';
            } else {
                switchPlayer();
            }
        }
        function switchPlayer() {
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            gameInfo.querySelector('p').textContent = `Player ${currentPlayer}'s Turn`;
        }
        function checkWin() {
            const winConditions = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];
            for (const condition of winConditions) {
                if (
                    board[condition[0]] !== '' &&
                    board[condition[0]] === board[condition[1]] &&
                    board[condition[0]] === board[condition[2]]
                ) {
                    return true;
                }
            }
            return false;
        }
        function checkDraw() {
            return board.every(cell => cell !== '');    

        }
        function resetGame() {
            board.fill('');
            gameOver = false;
            currentPlayer = 'X';
            gameInfo.querySelector('p').textContent = `Player ${currentPlayer}'s Turn`;
            const cells = gameBoard.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('x');
                cell.classList.remove('o');
            });
        }
        createBoard();
        resetButton.addEventListener('click', resetGame);

        // Create floating particles
        function createParticles() {
            // Remove any existing particles
            document.querySelectorAll('.particle').forEach(p => p.remove());
            
            // Create new particles
            for(let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Random starting position
                particle.style.left = Math.random() * 100 + 'vw';
                
                // Random size between 2-4px
                const size = 2 + Math.random() * 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                
                // Random animation duration between 15-25 seconds
                const duration = 15 + Math.random() * 10;
                particle.style.animation = `float ${duration}s linear infinite`;
                
                // Random delay
                particle.style.animationDelay = -Math.random() * duration + 's';
                
                document.body.appendChild(particle);
            }
        }

        // Initial creation
        createParticles();

        // Recreate particles every minute to prevent any potential memory issues
        setInterval(createParticles, 60000);
    </script>
</body>
</html>
