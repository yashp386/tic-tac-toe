<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copter Game</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: Arial, sans-serif;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
            border: 2px solid #333;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB, #4682B4);
        }

        #copter {
            position: absolute;
            width: 60px;
            height: 30px;
            left: 50px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="%23FFD700" d="M12,3L2,12h3v8h6v-6h2v6h6v-8h3L12,3z"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            transition: transform 0.1s;
        }

        .obstacle {
            position: absolute;
            width: 50px;
            background: #2d2d2d;
            right: -50px;
        }

        #score {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
        }

        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="copter"></div>
        <div id="score">Score: 0</div>
        <div id="start-screen">
            <h1>Copter Game</h1>
            <p>Press SPACE to fly up</p>
            <button id="start-button">Start Game</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
